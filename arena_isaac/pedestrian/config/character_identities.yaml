schema_version: 1

# Identity inventory for the Isaac 5.1 People assets used by Arena.
#
# Counting rules:
# - Classic original/new/short-name assets with the same appearance count as one identity.
# - One DH UUID counts as one identity.
# - A DH base asset and its Extended _1.._10 material variants remain one identity.
# - biped_demo is a rig/demo asset and is not a character identity.
#
# Accessory booleans below only mean that the Persona relationship exists. They
# do not classify the concrete child prim (for example safety helmet vs cap).
# safety_helmet therefore remains pending until the child prim scan is reviewed.

summary:
  classic_identities: 11
  dh_identities: 21
  total_identities: 32
  dh_appearances_per_identity: 11

# Scenario-facing pools. Every identity belongs to exactly one pool.
